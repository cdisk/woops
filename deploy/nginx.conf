# Console HTTPS on host :443 (default). Self-signed: same deploy/tls/gateway.* as Gateway.
# Local Vite still uses :5173 — this file is for the Docker console image.
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 64m;

    ssl_certificate     /tls/gateway.crt;
    ssl_certificate_key /tls/gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Gateway talks to control-api on :9100 directly. Do not expose those
    # permitAll hooks (verify-ticket, portmap tickets, interrupt-running) on 443.
    # woopsctl must use Gateway PUBLIC /api/opsctl, not Console.
    location ^~ /api/internal { return 404; }
    location ^~ /api/sessions/internal { return 404; }
    location ^~ /api/opsctl { return 404; }

    location /api/ {
        proxy_pass http://control-api:9100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Same-origin WS/install via Gateway INTERNAL (plain HTTP).
    # Gateway runs network_mode:host — reach via host-gateway (extra_hosts).
    # All browser sessions land here: rewriteWs() rewrites the ticket's browserWs
    # to this origin, so :9200 stays agent-only and needs no browser trust.
    location /ws/ {
        proxy_pass http://host.docker.internal:9201/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /i/ {
        proxy_pass http://host.docker.internal:9201/i/;
        proxy_set_header Host $host;
    }

    # Public woopsctl binaries (same Gateway bin dir as agents).
    location /bin/ {
        proxy_pass http://host.docker.internal:9201/bin/;
        proxy_set_header Host $host;
    }

    location / {
        # SPA history fallback. Do not use `$uri/` — it 301s into real dirs (e.g. old Vite `assets/`).
        try_files $uri /index.html;
    }
}
