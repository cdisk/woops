# 公开 Demo 专用的 Console nginx 配置：在 deploy/nginx.conf 的基础上加两样东西。
#   1. /demo/ 反代到 demo-broker（一键登录入口，必须与 Console 同源才能写 localStorage）
#   2. 往 index.html 注入一个浮动按钮，未登录时引导到 /demo/
# 通过 docker-compose.demo.yml 覆盖挂载到 /etc/nginx/conf.d/default.conf。
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 64m;

    ssl_certificate     /tls/gateway.crt;
    ssl_certificate_key /tls/gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/internal { return 404; }
    location ^~ /api/sessions/internal { return 404; }
    location ^~ /api/opsctl { return 404; }

    location /api/ {
        proxy_pass http://control-api:9100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:9201/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /i/ {
        proxy_pass http://host.docker.internal:9201/i/;
        proxy_set_header Host $host;
    }

    location /bin/ {
        proxy_pass http://host.docker.internal:9201/bin/;
        proxy_set_header Host $host;
    }

    # 一键进入演示。broker 同时认 /token 和 /demo/token，这里去掉前缀转发。
    location = /demo { return 301 /demo/; }
    location /demo/ {
        proxy_pass http://demo-broker:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;

        # 未登录时挂一个浮动入口，省得访客对着登录框找不到演示账号。
        sub_filter_once on;
        sub_filter '</body>' '<script>(function(){if(localStorage.getItem("token"))return;var a=document.createElement("a");a.href="/demo/";a.textContent="\u4e00\u952e\u8fdb\u5165\u6f14\u793a \u00b7 Enter demo";a.style.cssText="position:fixed;z-index:9999;left:50%;transform:translateX(-50%);bottom:28px;padding:12px 22px;background:#2F5D9F;color:#fff;font:600 14px/1 sans-serif;border-radius:999px;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.35)";document.body.appendChild(a);})();</script></body>';
    }
}
