# 用 Docker Hub 预构建镜像拉起全栈（无需本机编译）。
# 源码构建请用 deploy/docker-compose.yml。
#
# 前置：仓库根目录 .env（从 .env.example 复制）。deploy/tls 无证书时 tls-init 会自签并写入 compose-pin.env。
# 启动：docker compose --env-file .env --profile full --profile desktop up -d
#
# 镜像标签可用环境变量覆盖：WOOPS_IMAGE_TAG=0.1.1（默认）或 latest
services:
  postgres:
    image: timescale/timescaledb:2.29.2-pg16
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: create deploy/tls/gateway.* if missing; always refresh compose-pin.env (SPKI).
  tls-init:
    profiles: ["full"]
    image: alpine:3.20
    env_file:
      - .env
    volumes:
      - ./deploy/tls:/tls
      - ./deploy/compose-pin.env:/out/pin.env
      - ./deploy/ensure-gateway-tls.sh:/ensure-gateway-tls.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache openssl >/dev/null && exec /bin/sh /ensure-gateway-tls.sh
    restart: "no"

  control-api:
    profiles: ["full"]
    image: cdisk/woops-control-api:${WOOPS_IMAGE_TAG:-0.1.1}
    depends_on:
      postgres:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    env_file:
      - .env
      - ./deploy/compose-pin.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ops
      SPRING_DATASOURCE_USERNAME: ops
      SPRING_DATASOURCE_PASSWORD: ops
      OPS_GATEWAY_INTERNAL_HTTP: http://host.docker.internal:9201
      OPS_AUDIT_DIR: /data/ops-audit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9100:9100"
    volumes:
      - ./data/ops-audit:/data/ops-audit
    restart: unless-stopped

  gateway:
    profiles: ["full"]
    image: cdisk/woops-gateway:${WOOPS_IMAGE_TAG:-0.1.1}
    depends_on:
      tls-init:
        condition: service_completed_successfully
      control-api:
        condition: service_started
    network_mode: host
    env_file:
      - .env
      - ./deploy/compose-pin.env
    environment:
      OPS_CONTROL_INTERNAL_HTTP: http://127.0.0.1:9100
      OPS_GUACD_ADDR: 127.0.0.1:4822
      OPS_GUAC_BRIDGE_HOST: host.docker.internal
      OPS_GATEWAY_TLS_CERT: /tls/gateway.crt
      OPS_GATEWAY_TLS_KEY: /tls/gateway.key
      OPS_AGENT_BIN_DIR: /app/bin
      OPS_AUDIT_DIR: /data/ops-audit
    volumes:
      - ./deploy/tls:/tls:ro
      - ./data/ops-audit:/data/ops-audit
    restart: unless-stopped

  console:
    profiles: ["full"]
    image: cdisk/woops-console:${WOOPS_IMAGE_TAG:-0.1.1}
    depends_on:
      tls-init:
        condition: service_completed_successfully
      control-api:
        condition: service_started
      gateway:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:443"
    volumes:
      - ./deploy/tls:/tls:ro
    restart: unless-stopped

  guacd:
    profiles: ["desktop"]
    image: guacamole/guacd:1.5.5
    environment:
      HOME: /home/guacd
      GUACD_LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4822:4822"
    volumes:
      - guacd_home:/home/guacd
      - ./data/ops-audit:/data/ops-audit
    restart: unless-stopped

volumes:
  postgres_data:
  guacd_home:
